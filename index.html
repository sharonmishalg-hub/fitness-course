<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>קורס מאמני כושר</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* מיקום הפופאפ של המפרקים, כאן כדי שיעבוד גם אם style.css ישן */
    .joint-dialog {
      width: min(95vw, 900px);
      max-height: 90vh;
      max-height: 90dvh;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      margin: 0;
      position: fixed;
      bottom: auto;
      right: auto;
      height: auto;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: none;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
      background: #fff;
    }

    @media (max-width: 600px) {
      .joint-dialog {
        width: 92vw;
        max-height: 80vh;
        max-height: 80dvh;
        padding: 14px;
      }
      .joint-images img {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>קורס מאמני כושר</h1>
    <h2 class="subtitle">לאגודלית שלי, באהבה ❤️</h2>
    <p>חומר לימודי, תמונות ותרגילים. אפשר לחפש בכל הנושאים.</p>
    <input type="search" id="search" placeholder="חיפוש בחומר הלימודי..." aria-label="חיפוש">
  </header>

  <main>
    <p id="status" class="status"></p>
    <div id="results"></div>
    <section id="lessons"></section>
  </main>

  <footer>
    <p>עודכן לאחרונה: <span id="updated"></span></p>
  </footer>

  <dialog id="joint-dialog" class="joint-dialog"></dialog>

  <script src="lessons.js"></script>
  <script src="app.js"></script>
</body>
</html>
